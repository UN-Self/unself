# 发布流水线（决策 #79；W5 预期行为清单 E1–E10）
#
# 只做四件事：检出 → 装依赖 → 构建 → 推 npm。
# **不跑测试套件**：PR 阶段的 CI（.github/workflows/ci.yml）已经跑过。
#
# 认证 = npm Trusted Publishing（GitHub Actions OIDC）：仓库里**不存任何 npm token/secret**。
# 首次发布是人工的（维护者本机 `npm login` 后逐个包发一轮），之后在 npm 每个包的
# Settings → Trusted publishing 里配：组织 `UN-Self` / 仓库 `unself` / workflow 文件名 `release.yml`
# （**必须显式勾选允许直接 `npm publish`**——2026-09-03 之后新建的配置默认只允许 `npm stage publish`）。
# provenance 由 Trusted Publishing 自动生成，不需要 `--provenance`。
#
# 打 tag 前的三条前提：
#   ① tag 必须在 main 上（本 workflow 会校验）
#   ② 发版前有一次真机走查记录（docs/testing.md）
#   ③ 模块和库都用 npm publish。模块不走单独的打包器。
name: Release

on:
  push:
    tags:
      - 'sdk-v*'
      - 'hello-v*'
      - 'chat-v*'
      - 'workbench-v*'
      - 'installer-v*'

permissions:
  contents: read
  id-token: write # Trusted Publishing 的关键授权（OIDC）

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # E9：发布只从 main 出（决策 #79 前提⑧）
      - name: 校验 tag 在 main 上
        run: |
          git fetch --no-tags --depth=1 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME 不在 main 上——发布只从 main 出（决策 #79）"
            exit 1
          fi

      - name: 解析 tag
        id: rel
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          const tag = process.env.GITHUB_REF_NAME ?? '';
          const targets = {
            sdk: { package: '@unself/sdk', kind: 'workspace', dir: 'core/sdk' },
            installer: { package: '@unself/installer', kind: 'workspace', dir: 'app/installer' },
            workbench: { package: '@unself/workbench', kind: 'workspace', dir: 'app/workbench' },
            hello: { package: '@unself/hello', kind: 'module', dir: 'app/modules/hello' },
            chat: { package: '@unself/chat', kind: 'module', dir: 'app/modules/chat' },
          };
          const m = /^([a-z]+)-v(.+)$/.exec(tag.trim());
          const semver = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
          if (!m || !targets[m[1]] || !semver.test(m[2])) {
            console.error(`tag 不认识或版本不合法：${tag}`);
            process.exit(1);
          }
          const t = targets[m[1]];
          process.stdout.write(`name=${m[1]}\npackage=${t.package}\nkind=${t.kind}\ndir=${t.dir}\nversion=${m[2]}\n`);
          JS

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: 注入版本
        run: npm pkg set version="${{ steps.rel.outputs.version }}"
        working-directory: ${{ steps.rel.outputs.dir }}

      # npm publish 不改写 workspace:。改写成仓库里对应包的 version，再发布。
      # --ignore-scripts：上面已经 build；改过 package.json 后再跑 prepack 会和 lockfile 冲突。
      - name: 改写 workspace 依赖并发布
        working-directory: ${{ steps.rel.outputs.dir }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import { existsSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.env.GITHUB_WORKSPACE;
          const pkgDir = process.env.PKG_DIR;
          const yaml = await readFile(join(root, 'pnpm-workspace.yaml'), 'utf8');
          const patterns = yaml.split('\n').map((l) => /^\s*-\s*(.+?)\s*$/.exec(l)?.[1]).filter(Boolean);
          const versions = new Map();
          for (const pattern of patterns) {
            const dirs = [];
            if (pattern.includes('*')) {
              const [head, ...rest] = pattern.split('/*');
              const headDir = join(root, head);
              if (!existsSync(headDir)) continue;
              for (const d of await readdir(headDir, { withFileTypes: true })) {
                if (d.isDirectory()) dirs.push(join(headDir, d.name, ...rest));
              }
            } else dirs.push(join(root, pattern));
            for (const dir of dirs) {
              const pj = join(dir, 'package.json');
              if (!existsSync(pj)) continue;
              const parsed = JSON.parse(await readFile(pj, 'utf8'));
              if (parsed.name && parsed.version) versions.set(parsed.name, parsed.version);
            }
          }
          const pjPath = join(pkgDir, 'package.json');
          const pkg = JSON.parse(await readFile(pjPath, 'utf8'));
          for (const field of ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']) {
            const deps = pkg[field];
            if (!deps) continue;
            for (const [name, spec] of Object.entries(deps)) {
              const m = /^workspace:(.*)$/.exec(String(spec));
              if (!m) continue;
              const version = versions.get(name);
              if (!version) throw new Error(`找不到 ${name} 的版本`);
              const rest = m[1];
              deps[name] = rest === '*' || rest === '' ? version : rest === '^' ? `^${version}` : rest === '~' ? `~${version}` : rest;
            }
          }
          delete pkg.private;
          await writeFile(pjPath, JSON.stringify(pkg, null, 2) + '\n');
          JS
          if [ -f dist/worker.js ]; then cp dist/worker.js worker.js; fi
          npm publish --access public --ignore-scripts
        env:
          PKG_DIR: ${{ github.workspace }}/${{ steps.rel.outputs.dir }}
