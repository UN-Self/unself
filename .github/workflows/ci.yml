name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 工作流文件结构闸（真实事故：release.yml 里「- name: 改写 workspace: 协议依赖」未加引号
      # → GitHub 静默拒绝解析整份文件 → tag 推送不触发、0s 失败无日志，而 PR 上 CI 照样绿）
      - run: node scripts/verify-workflows.mjs
      # 结构闸（真实事故：#303 两桶重排当天，包整体深一层造成 4 处 tsconfig extends 断链——
      # tsc 静默退回默认配置、vite 报看不懂的错，行为测试不会红。目录类错误要在结构层抓）
      - run: node scripts/verify-paths.mjs
      # 顺序（issue #283）：**build 必须在 typecheck / test 之前**——
      # `@unself/sdk` 的 main/types 指向 dist（发布的形态），干净树上先 typecheck 会
      # 「Cannot find module '@unself/sdk'」（本地因 dist 已存在而绿，CI 红）。
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # lint 闸门（#195 机制③）：主题令牌 lint（仓库唯一 linter，零依赖单文件）
      - run: pnpm verify:tokens
      # 跨版本迁移闸门（#195 机制③）：老库（前 N-1 迁移 + 既有数据）→ 新迁移必须能跑通；
      # 全新库路径由 app/workbench/test/migrations.test.ts 覆盖，此处补升级路径。
      - run: node scripts/check-migrations-upgrade.mjs
